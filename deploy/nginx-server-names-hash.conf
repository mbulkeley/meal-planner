# Install: sudo cp deploy/nginx-server-names-hash.conf /etc/nginx/conf.d/server-names-hash.conf
#
# nginx sizes server_names_hash_bucket_size from the CPU cache line, which is
# 32 bytes on a 32-bit armhf userland (OXFORD: Pi 4, 64-bit kernel, armhf
# userland). That's too small for `recipes.mauriecloud.com`, and `nginx -t`
# fails with "could not build server_names_hash". 64 is enough for our names.
#
# This lives in conf.d/ (included inside the http block by Debian's
# nginx.conf) rather than editing nginx.conf, so package upgrades don't stop
# at a conffile prompt.
server_names_hash_bucket_size 64;
