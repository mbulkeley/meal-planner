# nginx site for meal-planner, behind Cloudflare Tunnel.
#
#   Cloudflare (HTTPS, Access) → cloudflared → nginx 127.0.0.1:8090 → gunicorn 127.0.0.1:8001
#
# Install:  sudo cp deploy/nginx-meal-planner.conf /etc/nginx/sites-available/meal-planner
#           sudo ln -s /etc/nginx/sites-available/meal-planner /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# nginx only listens on localhost: the tunnel is the only way in, so no
# firewall ports need opening. Future sites (e.g. a second app) add their own
# server block on the same 127.0.0.1:8090 with a different server_name, and
# cloudflared points every hostname at localhost:8090.

# Anything arriving without a known Host header gets dropped.
server {
    listen 127.0.0.1:8090 default_server;
    server_name _;
    return 444;
}

server {
    listen 127.0.0.1:8090;
    server_name recipes.mauriecloud.com;

    # iPhone photos are 3–8MB; leave headroom.
    client_max_body_size 25m;

    access_log /var/log/nginx/meal-planner.access.log;
    error_log  /var/log/nginx/meal-planner.error.log;

    # Output of `manage.py collectstatic` (STATIC_ROOT).
    location /static/ {
        alias /home/pi/Projects/meal-planner/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Uploaded recipe photos (MEDIA_ROOT).
    location /media/ {
        alias /home/pi/Projects/meal-planner/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        # Every request on this listener came through Cloudflare over HTTPS,
        # so tell Django that (pairs with DJANGO_BEHIND_PROXY=true).
        proxy_set_header X-Forwarded-Proto https;
        # Real visitor IP, as reported by Cloudflare.
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_read_timeout 60s;
    }
}
