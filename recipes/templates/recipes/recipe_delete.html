{% extends "recipes/base.html" %}

{% block title %}Delete {{ recipe.name }}{% endblock %}

{% block body %}
  <p class="nav"><a href="{% url 'recipes:detail' recipe.pk %}">&larr; {{ recipe.name }}</a></p>
  <h1 class="page-title">Delete "{{ recipe.name }}"?</h1>
  <p>This can't be undone.</p>

  <form method="post">
    {% csrf_token %}
    <button class="danger" type="submit">Yes, delete it</button>
  </form>
  <p class="hint"><a href="{% url 'recipes:detail' recipe.pk %}">Cancel</a></p>
{% endblock %}
