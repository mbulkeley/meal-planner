{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="{% static 'recipes/favicon.svg' %}">
  <title>Delete {{ recipe.name }}</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Delete "{{ recipe.name }}"?</h1>
  <p>This can't be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete it</button>
  </form>
  <p><a href="{% url 'recipes:detail' recipe.pk %}">Cancel</a></p>
</body>
</html>
