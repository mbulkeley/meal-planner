{% extends "recipes/base.html" %}

{% block title %}Edit {{ recipe.name }}{% endblock %}

{% block body %}
  <p class="nav"><a href="{% url 'recipes:detail' recipe.pk %}">&larr; {{ recipe.name }}</a></p>
  <h1 class="page-title">Edit recipe</h1>

  <div class="form-card">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Save changes</button>
    </form>
  </div>
{% endblock %}
